#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  alias __INSTALL_DIR__/www/;
  index index.html;
  try_files $uri $uri/ =404;

  # The JSON files change daily; always revalidate.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

  # Never serve the collector's temporary files.
  location ~ /\. {
    deny all;
  }
}

# Prometheus scrape target. SSOwat lets it through (see manifest), so access is
# limited to the addresses set in the config panel.
location = __PATH__/metrics {
  alias __INSTALL_DIR__/www/metrics;
  default_type "text/plain; version=0.0.4; charset=utf-8";
  add_header Cache-Control "no-store" always;
  __METRICS_ALLOW_RULES__
}
