#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  alias __INSTALL_DIR__/www/;
  index index.html;
  try_files $uri $uri/ =404;

  # Same header module as YunoHost's server-wide headers (nosniff etc.), which still apply.
  # The CSP here replaces YunoHost's looser one on this app's pages only.
  # The JSON files change daily; always revalidate.
  more_set_headers "Cache-Control: no-cache";
  more_set_headers "Referrer-Policy: same-origin";
  more_set_headers "Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'";

  # Never serve the collector's temporary files.
  location ~ /\. {
    deny all;
  }
}

# Prometheus scrape target. SSOwat lets it through (see manifest), so access is
# limited to the addresses set in the config panel.
location = __PATH__/metrics {
  alias __INSTALL_DIR__/www/metrics;
  default_type "text/plain; version=0.0.4; charset=utf-8";
  more_set_headers "Cache-Control: no-store";
  __METRICS_ALLOW_RULES__
}
